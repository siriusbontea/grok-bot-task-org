<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff</title>
  <meta name="description" content="Door names and seats. The story is on the portrait. Click a door.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,560;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314110e'/%3E%3Crect x='7' y='6' width='18' height='20' fill='none' stroke='%23c4a46a' stroke-width='1.5'/%3E%3Ccircle cx='20' cy='16' r='1.2' fill='%23c4a46a'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#board">Skip to staff board</a>

  <header class="mast">
    <div class="mast-inner">
      <p class="kicker">Personal board</p>
      <h1>Staff</h1>
      <p class="lede">Door names and seats. The story is on the portrait. Click a door.</p>
    </div>
  </header>

  <div class="shell" id="shell">
    <main class="board" id="board">
      <div class="chart-wrap">
        <div class="chart" id="chart">
          <svg class="lines" id="lines" aria-hidden="true"></svg>

          <div class="tier tier-cos">
            <button class="node" type="button" data-id="carl" id="n-carl" aria-expanded="false" aria-controls="panel">
              <span class="node-name">Carl</span>
              <span class="node-code">CoS</span>
            </button>
          </div>

          <div class="tier tier-dcos">
            <button class="node node-deputy" type="button" data-id="cordoba" id="n-cordoba" aria-expanded="false" aria-controls="panel">
              <span class="node-name">Córdoba</span>
              <span class="node-code">DCoS</span>
            </button>
          </div>

          <div class="tier tier-j" id="tier-j">
            <button class="node" type="button" data-id="cato" id="n-cato" aria-expanded="false" aria-controls="panel">
              <span class="node-name">Cato</span>
              <span class="node-code">J1</span>
            </button>
            <button class="node" type="button" data-id="jomini" id="n-jomini" aria-expanded="false" aria-controls="panel">
              <span class="node-name">Jomini</span>
              <span class="node-code">J2</span>
            </button>
            <button class="node" type="button" data-id="rommel" id="n-rommel" aria-expanded="false" aria-controls="panel">
              <span class="node-name">Rommel</span>
              <span class="node-code">J3</span>
            </button>
            <button class="node" type="button" data-id="xenophon" id="n-xenophon" aria-expanded="false" aria-controls="panel">
              <span class="node-name">Xenophon</span>
              <span class="node-code">J4</span>
            </button>
            <button class="node" type="button" data-id="moltke" id="n-moltke" aria-expanded="false" aria-controls="panel">
              <span class="node-name">Moltke</span>
              <span class="node-code">J5</span>
            </button>
          </div>
        </div>

        <aside class="off-staff" id="off-staff">
          <p class="off-label">Special Staff</p>
          <button class="node" type="button" data-id="fukuzawa" id="n-fukuzawa" aria-expanded="false" aria-controls="panel">
            <span class="node-name">Fukuzawa</span>
            <span class="node-code">Career</span>
          </button>
          <button class="node" type="button" data-id="vauban" id="n-vauban" aria-expanded="false" aria-controls="panel">
            <span class="node-name">Vauban</span>
            <span class="node-code">Design</span>
          </button>
          <button class="node" type="button" data-id="polybius" id="n-polybius" aria-expanded="false" aria-controls="panel">
            <span class="node-name">Polybius</span>
            <span class="node-code">Continuity</span>
          </button>
          <button class="node" type="button" data-id="hattori" id="n-hattori" aria-expanded="false" aria-controls="panel">
            <span class="node-name">Hattori</span>
            <span class="node-code">Certs</span>
          </button>
          <button class="node" type="button" data-id="hopper" id="n-hopper" aria-expanded="false" aria-controls="panel">
            <span class="node-name">Hopper</span>
            <span class="node-code">Learn</span>
          </button>
          <button class="node" type="button" data-id="faraday" id="n-faraday" aria-expanded="false" aria-controls="panel">
            <span class="node-name">Faraday</span>
            <span class="node-code">Agents</span>
          </button>
          <button class="node" type="button" data-id="lovelace" id="n-lovelace" aria-expanded="false" aria-controls="panel">
            <span class="node-name">Lovelace</span>
            <span class="node-code">LangChain</span>
          </button>
          <button class="node" type="button" data-id="galen" id="n-galen" aria-expanded="false" aria-controls="panel">
            <span class="node-name">Galen</span>
            <span class="node-code">Health</span>
          </button>
          <button class="node" type="button" data-id="tesler" id="n-tesler" aria-expanded="false" aria-controls="panel">
            <span class="node-name">Tesler</span>
            <span class="node-code">Swift</span>
          </button>
        </aside>
      </div>
    </main>

    <aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-door" hidden>
      <div class="panel-bar">
        <p class="panel-code" id="panel-code"></p>
        <button class="panel-close" type="button" id="panel-close" aria-label="Close panel">Close</button>
      </div>
      <h2 class="panel-door" id="panel-door"></h2>
      <p class="panel-full" id="panel-full"></p>
      <p class="panel-life" id="panel-life"></p>
      <p class="panel-cadence" id="panel-cadence"></p>

      <div class="tabs" role="tablist" aria-label="Dossier sections">
        <button class="tab" type="button" role="tab" id="tab-btn-role" aria-controls="tab-role" data-tab="role" aria-selected="false">Role</button>
        <button class="tab" type="button" role="tab" id="tab-btn-story" aria-controls="tab-story" data-tab="story" aria-selected="true">Story</button>
        <button class="tab" type="button" role="tab" id="tab-btn-duties" aria-controls="tab-duties" data-tab="duties" aria-selected="false">Duties</button>
      </div>

      <div class="tab-panel" id="tab-role" role="tabpanel" aria-labelledby="tab-btn-role" hidden>
        <p id="panel-role"></p>
      </div>
      <div class="tab-panel is-active" id="tab-story" role="tabpanel" aria-labelledby="tab-btn-story">
        <figure class="portrait">
          <img id="panel-portrait" alt="">
          <figcaption id="panel-caption"></figcaption>
        </figure>
        <p class="story-prose" id="panel-story"></p>
      </div>
      <div class="tab-panel" id="tab-duties" role="tabpanel" aria-labelledby="tab-btn-duties" hidden>
        <ul class="duty-list" id="panel-duties"></ul>
      </div>
    </aside>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <footer class="colophon">
    <a href="portraits/CREDITS.md">Portrait credits</a>
    <span class="sep" aria-hidden="true">·</span>
    <span>Personal board. Public map.</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
